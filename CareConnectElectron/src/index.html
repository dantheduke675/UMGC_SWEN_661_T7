<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <!-- Screen reader announcements: the page you moved to, and toast messages.
       Both regions are always rendered: the toast itself is visibility:hidden
       between messages, and text added to a hidden region is not announced. -->
  <div id="sr-page" class="sr-only" aria-live="polite"></div>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast">
    <span class="toast-msg" id="toast-msg"></span>
    <span class="toast-actions"></span>
  </div>
  <script src="app.js"></script>
</body>
</html>
